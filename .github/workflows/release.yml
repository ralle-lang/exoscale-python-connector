name: Release

# On version tags (v0.2.0, v1.0.0, ...) this builds the package, publishes it to
# PyPI via trusted publishing (no API token in the repo), and creates a matching
# GitHub Release whose notes come from the CHANGELOG section for that version.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the full check suite before building
        run: |
          pip install -e '.[dev]'
          ruff check src tests
          mypy src
          pytest tests/unit -q
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      # Pinned to a commit SHA: this third-party action receives the OIDC
      # token that authorizes publishing; a floating branch ref would let a
      # compromised upstream publish on our behalf. Bump deliberately.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # PEP 740 build attestations. The action defaults this on for Trusted
          # Publishing; set it explicitly so it can never silently regress.
          attestations: true

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release on this tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - name: Extract the CHANGELOG section for this tag
        # TAG comes from the (maintainer-controlled) tag ref; pass it via env and
        # reference it as a shell variable rather than interpolating into the
        # script, so the tag string is never evaluated as code.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then printf 'Release %s\n' "$TAG" > release-notes.md; fi
      # Pinned to a commit SHA (this third-party action gets a contents:write
      # token); bump deliberately.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: false
